name: Update profile stats

# 笔记仓库 math-of-li 有新提交时，自动重新生成 README 里的统计图表。
# 每天 03:00 UTC（北京时间 11:00）兜底检查一次。

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      # fetch-depth: 0 是必须的 —— 脚本用 `git log --numstat` 统计
      # 各课程的累计新增行数，浅克隆（默认 depth=1）会漏掉全部历史。
      - name: Checkout math-of-li
        uses: actions/checkout@v4
        with:
          repository: lisdscn/math-of-li
          ref: main
          path: .math-of-li
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate SVG charts
        run: |
          python tools/gen_stats.py \
            --repo .math-of-li \
            --ref HEAD \
            --out assets

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain -- assets)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: refresh stats charts from math-of-li"
            git push
            echo "::notice::统计图表已更新"
          else
            echo "统计数据无变化，跳过提交"
          fi
