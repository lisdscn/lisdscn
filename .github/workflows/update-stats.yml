name: Refresh profile charts

# 每天刷新个人主页上的两类图表（北京时间 11:00 左右）：
#   1. 从 math-of-li 统计出的知识分布 / 贡献概览 SVG
#   2. 把 GitHub 贡献图渲染成的贪吃蛇动画 SVG
# 笔记仓库有新提交时也会立即跑一次。

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      # fetch-depth: 0 是必须的 —— 脚本用 `git log --numstat` 统计
      # 各课程的累计新增行数，浅克隆（默认 depth=1）会漏掉全部历史。
      - name: Checkout math-of-li
        uses: actions/checkout@v4
        with:
          repository: lisdscn/math-of-li
          ref: main
          path: .math-of-li
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate SVG charts
        run: |
          python tools/gen_stats.py \
            --repo .math-of-li \
            --ref HEAD \
            --out assets

      # 贡献贪吃蛇：小蛇在贡献网格上游走、把有贡献的格子吃掉。
      # 用默认的 github.token 读公开贡献数据；产出是 CSS keyframes 动画 SVG，
      # 在 <img> 里会自行循环播放，不需要任何脚本。
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-light
            assets/snake-dark.svg?palette=github-dark

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain -- assets)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: refresh profile charts (stats + snake)"
            git push
            echo "::notice::统计图表已更新"
          else
            echo "统计数据无变化，跳过提交"
          fi
